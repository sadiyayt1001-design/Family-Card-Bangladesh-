<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>বাংলাদেশ স্মার্ট কার্ড</title>

<!-- html2canvas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<!-- JsBarcode -->
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#006a4e,#f42a41);
    text-align:center;
    padding:20px;
    color:white;
}

.owner{
    font-size:20px;
    font-weight:bold;
    margin-bottom:15px;
}

.container{
    background:white;
    color:black;
    padding:20px;
    width:350px;
    margin:auto;
    border-radius:10px;
}

input{
    width:100%;
    padding:8px;
    margin:5px 0;
}

button{
    padding:10px;
    width:100%;
    background:#006a4e;
    color:white;
    border:none;
    cursor:pointer;
    margin-top:10px;
    font-weight:bold;
    border-radius:5px;
}

/* CARD DESIGN */
.card{
    margin-top:30px;
    width:420px;
    height:260px;
    margin-left:auto;
    margin-right:auto;
    border-radius:18px;
    padding:20px;
    color:white;
    display:none;
    background: linear-gradient(135deg,#006a4e,#d32f2f);
    box-shadow:0 15px 35px rgba(0,0,0,0.6);
    position:relative;
}

.card-title{
    font-size:16px;
    font-weight:bold;
}

.chip{
    width:60px;
    height:45px;
    background:gold;
    border-radius:8px;
    margin-top:10px;
}

.card-number{
    margin-top:15px;
    font-size:18px;
    letter-spacing:3px;
    font-weight:bold;
}

.barcode{
    margin-top:5px;
    background:white;
    padding:3px;
    border-radius:5px;
}

.details{
    margin-top:10px;
    font-size:13px;
}

.photo{
    position:absolute;
    right:20px;
    bottom:60px;
    width:80px;
    height:100px;
    border-radius:8px;
    border:2px solid white;
    object-fit:cover;
}

.footer-text{
    position:absolute;
    bottom:10px;
    left:20px;
    font-size:12px;
    font-style:italic;
}

.download-btn{
    margin-top:20px;
    background:#f42a41;
}
</style>
</head>
<body>

<div class="owner">Website Owner: তারিকুল</div>

<h2>বাংলাদেশ স্মার্ট কার্ড জেনারেটর</h2>

<div class="container">
    <input type="text" id="name" placeholder="নাম লিখুন">
    <input type="file" id="photo" accept="image/*">
    <button onclick="generateCard()">কার্ড তৈরি করো</button>
</div>

<div class="card" id="smartCard">
    <div class="card-title">বাংলাদেশ স্মার্ট কার্ড</div>
    <div class="chip"></div>

    <div class="card-number" id="cardNumber"></div>

    <div class="barcode">
        <svg id="barcode"></svg>
    </div>

    <div class="details">
        নাম: <span id="cardName"></span><br>
        মেয়াদ শেষ: <span id="expiry"></span>
    </div>

    <img id="cardPhoto" class="photo">

    <div class="footer-text">I Have A Plan</div>
</div>

<button class="download-btn" onclick="downloadCard()">ডাউনলোড করো</button>

<script>
function generateCard(){

    document.getElementById("smartCard").style.display="block";

    // Name
    let name = document.getElementById("name").value;
    document.getElementById("cardName").innerText = name;

    // 16 Digit Card Number
    let number="";
    for(let i=0;i<16;i++){
        number += Math.floor(Math.random()*10);
    }

    // Format with space
    let formatted = number.replace(/(.{4})/g,"$1 ").trim();
    document.getElementById("cardNumber").innerText = formatted;

    // Barcode
    JsBarcode("#barcode", number, {
        format: "CODE128",
        width:2,
        height:40,
        displayValue:false
    });

    // Random Day & Month, Year fixed 2028
    let day = ("0" + (Math.floor(Math.random()*28)+1)).slice(-2);
    let month = ("0" + (Math.floor(Math.random()*12)+1)).slice(-2);
    document.getElementById("expiry").innerText = day+"/"+month+"/2028";

    // Photo
    let file=document.getElementById("photo").files[0];
    let reader=new FileReader();

    reader.onload=function(e){
        document.getElementById("cardPhoto").src=e.target.result;
    }

    if(file){
        reader.readAsDataURL(file);
    }
}

function downloadCard(){
    html2canvas(document.getElementById("smartCard")).then(canvas=>{
        let link=document.createElement("a");
        link.download="bangladesh_smart_card.png";
        link.href=canvas.toDataURL();
        link.click();
    });
}
</script>

</body>
</html>
