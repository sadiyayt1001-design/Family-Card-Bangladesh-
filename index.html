<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ফ্যামিলি কার্ড</title>

<style>
body{
    font-family: SolaimanLipi, Arial, sans-serif;
    background:#f0f0f0;
    text-align:center;
    padding:20px;
}

.container{
    background:white;
    padding:20px;
    width:350px;
    margin:auto;
    border-radius:8px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

input{
    width:100%;
    padding:8px;
    margin:5px 0;
}

button{
    padding:10px;
    width:100%;
    background:#006a4e;
    color:white;
    border:none;
    cursor:pointer;
    margin-top:10px;
}

.card{
    margin-top:20px;
    width:400px;
    margin-left:auto;
    margin-right:auto;
    border:2px solid #006a4e;
    background:white;
    padding:15px;
    display:none;
}

.header{
    background:#006a4e;
    color:white;
    padding:5px;
    font-weight:bold;
}

.sub-header{
    background:#f42a41;
    color:white;
    padding:3px;
    font-size:14px;
}

.card-body{
    display:flex;
    margin-top:10px;
    text-align:left;
}

.card-body img{
    width:110px;
    height:120px;
    border:1px solid black;
    margin-right:10px;
    object-fit:cover;
}

.info p{
    margin:4px 0;
}
</style>
</head>
<body>

<h2>ফ্যামিলি কার্ড জেনারেটর</h2>

<div class="container">
    <input type="text" id="name" placeholder="নাম">
    <input type="text" id="father" placeholder="পিতার নাম">
    <input type="text" id="mother" placeholder="মাতার নাম">
    <input type="text" id="address" placeholder="ঠিকানা">
    <input type="file" id="photo" accept="image/*">
    <button onclick="generateCard()">কার্ড তৈরি করো</button>
</div>

<div class="card" id="familyCard">
    <div class="header">গণপ্রজাতন্ত্রী বাংলাদেশ সরকার</div>
    <div class="sub-header">ফ্যামিলি কার্ড</div>

    <div class="card-body">
        <img id="cardPhoto">
        <div class="info">
            <p id="cardName"></p>
            <p id="cardFather"></p>
            <p id="cardMother"></p>
            <p id="cardAddress"></p>
            <p id="cardNumber"></p>
        </div>
    </div>
</div>

<script>
function generateCard(){

    document.getElementById("familyCard").style.display="block";

    document.getElementById("cardName").innerText=
    "নাম: "+document.getElementById("name").value;

    document.getElementById("cardFather").innerText=
    "পিতা: "+document.getElementById("father").value;

    document.getElementById("cardMother").innerText=
    "মাতা: "+document.getElementById("mother").value;

    document.getElementById("cardAddress").innerText=
    "ঠিকানা: "+document.getElementById("address").value;

    let randomNumber = "FC-2026-"+Math.floor(100+Math.random()*900);
    document.getElementById("cardNumber").innerText=
    "কার্ড নং: "+randomNumber;

    let file=document.getElementById("photo").files[0];
    let reader=new FileReader();

    reader.onload=function(e){
        document.getElementById("cardPhoto").src=e.target.result;
    }

    if(file){
        reader.readAsDataURL(file);
    }
}
</script>

</body>
</html>
