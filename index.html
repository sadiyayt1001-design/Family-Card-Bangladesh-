<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Family Card</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#141e30,#243b55);
    text-align:center;
    padding:20px;
    color:white;
}

.owner{
    font-size:20px;
    font-weight:bold;
    margin-bottom:10px;
}

.container{
    background:white;
    color:black;
    padding:20px;
    width:350px;
    margin:auto;
    border-radius:10px;
}

input{
    width:100%;
    padding:8px;
    margin:5px 0;
}

button{
    padding:10px;
    width:100%;
    background:#00c6ff;
    color:white;
    border:none;
    cursor:pointer;
    margin-top:10px;
    font-weight:bold;
    border-radius:5px;
}

/* Smart Card Design */
.card{
    margin-top:30px;
    width:420px;
    height:240px;
    margin-left:auto;
    margin-right:auto;
    border-radius:15px;
    padding:20px;
    color:white;
    display:none;
    background: linear-gradient(135deg,#00c6ff,#0072ff);
    box-shadow:0 10px 25px rgba(0,0,0,0.5);
    position:relative;
}

.card-title{
    font-size:14px;
    font-weight:bold;
    letter-spacing:1px;
}

.card-number{
    position:absolute;
    top:20px;
    right:20px;
    font-size:12px;
}

.card-body{
    display:flex;
    margin-top:20px;
}

.card-body img{
    width:100px;
    height:120px;
    border-radius:10px;
    border:2px solid white;
    object-fit:cover;
    margin-right:15px;
}

.info p{
    margin:5px 0;
    font-size:13px;
}

.footer-text{
    position:absolute;
    bottom:15px;
    left:20px;
    font-size:12px;
    font-style:italic;
    opacity:0.9;
}

.download-btn{
    margin-top:15px;
    background:#ff9800;
}
</style>
</head>
<body>

<div class="owner">Website Owner: তারিকুল</div>

<h2>Smart Family Card Generator</h2>

<div class="container">
    <input type="text" id="name" placeholder="নাম">
    <input type="text" id="father" placeholder="পিতার নাম">
    <input type="text" id="mother" placeholder="মাতার নাম">
    <input type="text" id="address" placeholder="ঠিকানা">
    <input type="file" id="photo" accept="image/*">
    <button onclick="generateCard()">কার্ড তৈরি করো</button>
</div>

<div class="card" id="familyCard">
    <div class="card-title">SMART FAMILY CARD</div>
    <div class="card-number" id="cardNumber"></div>

    <div class="card-body">
        <img id="cardPhoto">
        <div class="info">
            <p id="cardName"></p>
            <p id="cardFather"></p>
            <p id="cardMother"></p>
            <p id="cardAddress"></p>
        </div>
    </div>

    <div class="footer-text">I Have A Plan</div>
</div>

<button class="download-btn" onclick="downloadCard()">ডাউনলোড করো</button>

<script>
function generateCard(){

    document.getElementById("familyCard").style.display="block";

    document.getElementById("cardName").innerText=
    "Name: "+document.getElementById("name").value;

    document.getElementById("cardFather").innerText=
    "Father: "+document.getElementById("father").value;

    document.getElementById("cardMother").innerText=
    "Mother: "+document.getElementById("mother").value;

    document.getElementById("cardAddress").innerText=
    "Address: "+document.getElementById("address").value;

    let randomNumber = "SFC-"+Math.floor(100000+Math.random()*900000);
    document.getElementById("cardNumber").innerText=randomNumber;

    let file=document.getElementById("photo").files[0];
    let reader=new FileReader();

    reader.onload=function(e){
        document.getElementById("cardPhoto").src=e.target.result;
    }

    if(file){
        reader.readAsDataURL(file);
    }
}

function downloadCard(){
    html2canvas(document.getElementById("familyCard")).then(canvas=>{
        let link=document.createElement("a");
        link.download="smart_family_card.png";
        link.href=canvas.toDataURL();
        link.click();
    });
}
</script>

</body>
</html>
